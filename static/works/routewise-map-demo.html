<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ตัวอย่างระบบแผนที่เขตขาย</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Leelawadee UI","Sarabun","Segoe UI",sans-serif;height:100vh;overflow:hidden;background:#12151c;color:#e7ecf3}
  .wrap{display:flex;height:100vh}
  .side{width:310px;flex:none;background:#1a1f29;border-right:1px solid #2a3140;overflow-y:auto;padding:14px}
  #map{flex:1}
  h1{font-size:15px;margin-bottom:2px}
  .sub{font-size:11px;color:#8d98ab;margin-bottom:12px;line-height:1.5}
  .warn{background:#3a1d22;border:1px solid #7d2b38;color:#ffc4cc;font-size:11px;
        padding:8px 10px;border-radius:8px;margin-bottom:12px;line-height:1.6}
  .ok{background:#16301f;border:1px solid #2c6b45;color:#b6f0cd}
  .box{border-top:1px solid #2a3140;padding-top:11px;margin-top:11px}
  .box h2{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:#8d98ab;margin-bottom:8px}
  .stat{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:#c9d3e0}
  .stat b{color:#fff}
  label.row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;cursor:pointer}
  label.row input{accent-color:#06c755;width:15px;height:15px}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .cnt{margin-left:auto;color:#8d98ab;font-size:11px}
  select,button{width:100%;background:#0f131b;border:1px solid #2a3140;color:#e7ecf3;
                border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px;margin-top:6px;cursor:pointer}
  button:hover{background:#232b39}
  .leaflet-popup-content{font-family:inherit;font-size:13px;line-height:1.65;min-width:190px}
  .leaflet-popup-content b{font-size:14px}
  .pill{display:inline-block;background:#eef1f5;color:#333;border-radius:99px;padding:1px 8px;font-size:11px;margin-right:4px}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <h1>ตัวอย่างระบบแผนที่เขตขาย</h1>
    <div class="sub">898 จุดตัวอย่าง · 7 เขตขาย · ข้อมูลสาธิต</div>
    <div class="warn ok">✅ ไฟล์เดโม: ชื่อร้านสมมติทั้งหมด · พิกัดถูกเลื่อนแบบสุ่ม 300–900 ม. · ไม่มีเบอร์โทรและชื่อผู้ติดต่อใด ๆ — ส่งให้ลูกค้าดูได้อย่างปลอดภัย</div>

    <div class="box">
      <h2>ภาพรวม</h2>
      <div class="stat"><span>ร้านที่ปักหมุดได้</span><b id="s-total">0</b></div>
      <div class="stat"><span>สายขาย</span><b id="s-lines">0</b></div>
      <div class="stat"><span>กำลังแสดงอยู่</span><b id="s-shown">0</b></div>
    </div>

    <div class="box">
      <h2>สายขาย</h2>
      <div id="lines"></div>
    </div>

    <div class="box">
      <h2>กรองตามวันเยี่ยม</h2>
      <select id="day"><option value="">— ทุกวัน —</option></select>
      <button id="fit">ซูมให้เห็นทุกจุดที่แสดง</button>
      <button id="mask">👁 โหมดปิดบังชื่อร้าน (ตอนแคปหน้าจอ)</button>
    </div>
  </aside>
  <div id="map"></div>
</div>

const COLORS = ["#e6194b", "#3cb44b", "#f58231", "#4363d8", "#911eb4", "#00a0a0", "#bcbd22", "#e377c2"];
let masked = false;

const map = L.map('map', {preferCanvas:true}).setView([18.79, 98.98], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);

const lines = [...new Set(DATA.map(d=>d.line))].sort();
const colorOf = {};
lines.forEach((l,i)=> colorOf[l] = COLORS[i % COLORS.length]);

const days = [...new Set(DATA.map(d=>d.day).filter(Boolean))].sort();
const daySel = document.getElementById('day');
days.forEach(d=>{ const o=document.createElement('option'); o.value=d; o.textContent=d; daySel.appendChild(o); });

const active = new Set(lines);
const layer = L.layerGroup().addTo(map);

function popupHtml(d){
  const name = masked ? '••••••••' : (d.n || '(ไม่มีชื่อ)');
  let h = `<b>${name}</b><br><span class="pill">${d.line}</span>`;
  if(d.day)  h += `<span class="pill">${d.day}</span>`;
  if(d.type) h += `<br><span style="color:#666">${d.type}</span>`;
  if(!masked){
    if(d.addr) h += `<br>${d.addr}`;
    if(d.area) h += `<br><span style="color:#666">${d.area}</span>`;
    if(d.tel)  h += `<br>☎ ${d.tel}`;
    if(d.cp)   h += `<br>👤 ${d.cp}`;
  }
  h += `<br><span style="color:#999;font-size:11px">${d.id} · ${d.lat}, ${d.lng}</span>`;
  return h;
}

function draw(){
  layer.clearLayers();
  const day = daySel.value;
  let shown = 0;
  const pts = [];
  DATA.forEach(d=>{
    if(!active.has(d.line)) return;
    if(day && d.day !== day) return;
    shown++;
    pts.push([d.lat, d.lng]);
    L.circleMarker([d.lat,d.lng], {
      radius:5, color:'#fff', weight:1, opacity:.85,
      fillColor:colorOf[d.line], fillOpacity:.88
    }).bindPopup(popupHtml(d)).addTo(layer);
  });
  document.getElementById('s-shown').textContent = shown.toLocaleString();
  return pts;
}

function buildLineList(){
  const box = document.getElementById('lines');
  box.innerHTML = '';
  lines.forEach(l=>{
    const n = DATA.filter(d=>d.line===l).length;
    const lb = document.createElement('label'); lb.className='row';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=true;
    cb.onchange = ()=>{ cb.checked ? active.add(l) : active.delete(l); draw(); };
    const dot = document.createElement('span'); dot.className='dot'; dot.style.background=colorOf[l];
    const tx = document.createElement('span'); tx.textContent = l;
    const c = document.createElement('span'); c.className='cnt'; c.textContent = n;
    lb.append(cb, dot, tx, c); box.appendChild(lb);
  });
}

document.getElementById('s-total').textContent = DATA.length.toLocaleString();
document.getElementById('s-lines').textContent = lines.length;
buildLineList();
const all = draw();
if(all.length) map.fitBounds(L.latLngBounds(all).pad(0.05));

daySel.onchange = draw;
document.getElementById('fit').onclick = ()=>{ const p=draw(); if(p.length) map.fitBounds(L.latLngBounds(p).pad(0.05)); };
document.getElementById('mask').onclick = (e)=>{
  masked = !masked;
  e.target.textContent = masked ? '👁 ปิดบังอยู่ — กดเพื่อแสดงชื่อจริง' : '👁 โหมดปิดบังชื่อร้าน (ตอนแคปหน้าจอ)';
  draw();
};
</script>
