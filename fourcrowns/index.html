<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FOUR CROWNS · ศึกสี่มงกุฎ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Kanit:wght@300;400;500;600&family=Unbounded:wght@700;900&display=swap">
  <script type="module" crossorigin src="/fourcrowns/assets/index-Cto_b0d3.js"></script>
  <link rel="stylesheet" crossorigin href="/fourcrowns/assets/index-CoEQFpvC.css">
</head>
<body>
  <div id="stage"></div>

  <header class="hud-top">
    <div class="brand"><b>FOUR CROWNS</b><span>ศึกสี่มงกุฎ</span></div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="turn" id="turn"></div>

  <aside class="log" id="log" aria-live="polite"></aside>

  <footer class="hud-bottom">
    <div class="ap" id="ap"></div>
    <div class="actions">
      <button id="btnRoll" class="primary">ทอยเต๋า</button>
      <button id="btnEnd">จบตา</button>
      <button id="btnSeat" title="กลับที่นั่ง">กลับที่นั่ง</button>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <div class="modal" id="duel" hidden>
    <div class="card">
      <div class="duel-row">
        <div class="fighter" id="duelA"></div>
        <div class="vs">ปะทะ</div>
        <div class="fighter" id="duelD"></div>
      </div>
      <div class="duel-result" id="duelR"></div>
    </div>
  </div>

  <div class="modal" id="win" hidden>
    <div class="card">
      <div class="win-title" id="winT"></div>
      <div class="win-sub" id="winS"></div>
      <button id="btnAgain" class="primary">เริ่มเกมใหม่</button>
    </div>
  </div>

</body>
</html>
