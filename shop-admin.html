<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการราคา — Shop Admin</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#232a34;--text:#e9edf2;--muted:#9aa4b2;--accent:#3ddc97;--danger:#ff6b6b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Sarabun',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .wrap{max-width:640px;margin:0 auto;padding:40px 20px}
  h1{font-size:22px;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px}
  input[type=password],input[type=text]{width:100%;background:#0d1117;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 12px;font-size:16px}
  textarea{width:100%;background:#0d1117;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font-size:15px;font-family:inherit;line-height:1.5;resize:vertical}
  .field-label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  .add-group-row,.add-cat-row{display:flex;gap:8px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
  .add-group-row input[type=text],.add-cat-row input[type=text]{flex:1;min-width:160px}
  .add-cat-row input.emoji-input{flex:0 0 72px;min-width:72px}
  button{background:var(--accent);color:#062015;font-weight:700;border:none;border-radius:8px;padding:11px 20px;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:12px;font-size:14px}
  .msg.err{color:var(--danger)}
  .msg.ok{color:var(--accent)}
  .cat-title{font-size:17px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
  .grp-name{color:var(--muted);font-size:13px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  .hot-tag{background:rgba(61,220,151,.14);color:var(--accent);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px}
  .item-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .item-row:last-child{border-bottom:none}
  .item-name{grid-column:1/-1}
  .link-btn{background:none;border:none;color:var(--accent);font-size:13px;padding:0;cursor:pointer;text-decoration:underline}
  .item-row label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
  .name-line{display:flex;gap:8px;align-items:center}
  .name-line input{flex:1}
  .del-btn{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;flex-shrink:0}
  .item-row.deleting input{opacity:.45;text-decoration:line-through}
  .item-row.new-item{border-left:3px solid var(--accent);padding-left:10px;border-bottom:1px solid var(--line)}
  .add-item-btn{margin:10px 0 2px;font-size:14px}
  .save-bar{position:sticky;bottom:0;background:var(--bg);padding:16px 0;border-top:1px solid var(--line);margin-top:24px;display:flex;justify-content:flex-end;gap:10px;align-items:center}
  .hint{color:var(--muted);font-size:13px}
  .help-banner{background:rgba(61,220,151,.08);border:1px solid var(--accent);border-radius:12px;padding:16px 40px 16px 16px;margin-bottom:20px;position:relative;font-size:14px}
  .help-banner ol{margin:8px 0 0 18px}
  .help-banner li{margin-bottom:4px;color:var(--text)}
  .help-banner .close-x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:18px;padding:2px 6px;line-height:1}
  .bot-toggle-card{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .toggle-switch{position:relative;width:46px;height:26px;flex-shrink:0}
  .toggle-switch input{opacity:0;width:0;height:0;position:absolute}
  .toggle-slider{position:absolute;inset:0;background:#39414f;border-radius:999px;cursor:pointer;transition:background .15s}
  .toggle-slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s}
  .toggle-switch input:checked + .toggle-slider{background:var(--accent)}
  .toggle-switch input:checked + .toggle-slider:before{transform:translateX(20px)}
  .toggle-switch input:disabled + .toggle-slider{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SLUG = location.pathname.split('/').filter(Boolean).pop();
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pinKey = 'shopadmin_pin_' + SLUG;

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({'Content-Type': 'application/json'}, opts.headers || {});
  const pin = localStorage.getItem(pinKey);
  if (pin) headers['X-Shop-Admin-Pin'] = pin;
  const res = await fetch('/api/shop-admin/' + SLUG + path, Object.assign({}, opts, {headers}));
  return res.json();
}

function renderLogin(bizName, errMsg) {
  $('#app').innerHTML = `
    <div class="wrap">
      <h1>${esc(bizName || SLUG)}</h1>
      <div class="sub">จัดการราคา/โปรโมชั่นด้วยตัวเอง</div>
      <div class="card">
        <label style="display:block;margin-bottom:8px;font-size:14px;color:var(--muted)">รหัส PIN</label>
        <input type="password" id="pinInput" inputmode="numeric" placeholder="••••">
        <div style="margin-top:14px"><button id="loginBtn">เข้าสู่ระบบ</button></div>
        ${errMsg ? `<div class="msg err">${esc(errMsg)}</div>` : ''}
      </div>
    </div>`;
  $('#loginBtn').onclick = doLogin;
  $('#pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('#pinInput').focus();
}

async function doLogin() {
  const pin = $('#pinInput').value.trim();
  if (!pin) return;
  const r = await fetch('/api/shop-admin/' + SLUG + '/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pin})
  }).then(r => r.json());
  if (r.success) {
    localStorage.setItem(pinKey, pin);
    loadEditor();
  } else {
    renderLogin(null, r.error || 'เข้าสู่ระบบไม่สำเร็จ');
  }
}

let originalItems = {};   // "cat_id:group_idx:item_idx" -> {p, d}
let dirty = {};
let added = {};           // "newN" -> {cat_id, group_idx, n, p, d} (แถวที่ผู้ใช้กดเพิ่ม ยังไม่บันทึก)
let deleted = {};         // itemKey -> ชื่อเดิมจากเซิร์ฟเวอร์ (ส่งเป็น expected_n กันลบผิดตัว)
let newRowSeq = 0;

function itemKey(catId, gIdx, iIdx) { return catId + ':' + gIdx + ':' + iIdx; }

const FIELD_DEFS = [
  {key: 'gift',         label: '🎁 ของแถม / ของขวัญลูกค้า'},
  {key: 'perks',        label: '🍰 สิทธิพิเศษทุกบริการ'},
  {key: 'friend_promo', label: '👯 โปรพิเศษ (เช่น พาเพื่อน / Beauty Day)'},
  {key: 'topup_promo',  label: '💎 โปรสมาชิก / สะสมแต้ม / เติมเครดิต'},
  {key: 'coming_soon',  label: '🔜 บริการที่กำลังจะเปิด'},
  {key: 'promo_end',    label: '⏰ โปรโมชั่นหมดเขต — ใส่เป็นวันที่ เช่น 31 ตุลาคม 2569 / 31 ต.ค. 2569 / 2026-10-31 (บอทจะแจ้งทุกครั้งที่บอกราคาโปร และเลิกเสนอโปรอัตโนมัติเมื่อเลยวันนี้)', rows: 1},
  {key: 'hours',        label: '🕙 เวลาเปิด-ปิดร้าน (เช่น ทุกวัน 10:00–20:00 น.)', rows: 1},
  {key: 'style_rules',  label: '📜 กติกาการตอบเพิ่มเติมของร้าน (บรรทัดละ 1 ข้อ)', list: 'lines', rows: 5},
  {key: 'close_lines',  label: '🔚 ประโยคชวนจองปิดท้าย (บรรทัดละ 1 ประโยค)', list: 'lines', rows: 3},
  {key: 'reply_scripts', label: '💬 สคริปต์ตัวอย่างตอบลูกค้า (คั่นแต่ละสคริปต์ด้วยบรรทัดว่าง · ขึ้นต้นด้วย [สถานการณ์] แล้วตามด้วยคำตอบ · บอทใช้เป็นแนวทาง ไม่ได้อ่านซ้ำทั้งหมด และราคายึดเมนูเสมอ)', list: 'blocks', rows: 10},
];
const FIELD_DEF = Object.fromEntries(FIELD_DEFS.map(f => [f.key, f]));

// ฟิลด์แบบรายการโชว์ใน textarea เดียว: 'lines' = บรรทัดละ 1 รายการ · 'blocks' = คั่นด้วยบรรทัดว่าง
function fieldToText(f, v) {
  if (!f || !f.list) return v || '';
  const arr = Array.isArray(v) ? v : [];
  return arr.join(f.list === 'blocks' ? '\n\n' : '\n');
}
function textToField(f, t) {
  if (!f || !f.list) return t;
  const parts = f.list === 'blocks' ? t.split(/\n\s*\n/) : t.split('\n');
  return parts.map(s => s.trim()).filter(Boolean);
}

let fieldsDirty = false;   // ข้อความในกล่อง "สิทธิพิเศษ/โปรพิเศษ" ที่แก้แล้วยังไม่กด "บันทึกข้อความ"

function hasPendingChanges() {
  return fieldsDirty || Object.keys(dirty).length + Object.keys(added).length + Object.keys(deleted).length > 0;
}

function renderEditor(categories, botEnabled, showDetails, fields) {
  fields = fields || {};
  originalItems = {};
  dirty = {};
  added = {};
  deleted = {};
  fieldsDirty = false;
  const catsHtml = categories.map(cat => `
    <div class="cat-title">${esc(cat.emoji)} ${esc(cat.name)}</div>
    ${cat.groups.map(grp => `
      <div class="grp-name">${esc(grp.name)}${grp.hot ? '<span class="hot-tag">โปรฮอต</span>' : ''}</div>
      ${grp.items.map(it => {
        const key = itemKey(cat.id, grp.group_idx, it.idx);
        originalItems[key] = {n: it.n, p: it.p, d: it.d};
        return `
        <div class="item-row" data-key="${esc(key)}">
          <div class="item-name">
            <label>ชื่อรายการ</label>
            <div class="name-line">
              <input type="text" class="n-input" value="${esc(it.n)}">
              <button class="del-btn" type="button">ลบ</button>
            </div>
          </div>
          <div>
            <label>ราคา</label>
            <input type="text" class="p-input" value="${esc(it.p)}">
          </div>
          <div>
            <label>รายละเอียด</label>
            <input type="text" class="d-input" value="${esc(it.d)}">
          </div>
        </div>`;
      }).join('')}
      <div class="add-slot" data-slot="${esc(cat.id)}:${grp.group_idx}"></div>
      <div><button class="link-btn add-item-btn" type="button" data-cat="${esc(cat.id)}" data-gidx="${grp.group_idx}">＋ เพิ่มรายการ</button></div>
    `).join('')}
    <div class="add-group-row" data-cat="${esc(cat.id)}">
      <input type="text" class="grp-name-input" placeholder="ชื่อหมวดย่อยใหม่ในหมวด ${esc(cat.name)} เช่น เมนูต่อขนตา">
      <label class="hint" style="white-space:nowrap"><input type="checkbox" class="grp-hot-input"> โปรฮอต</label>
      <button class="link-btn add-group-btn" type="button">＋ เพิ่มหมวดย่อย</button>
    </div>
  `).join('');
  const fieldsHtml = `
      <div class="card" id="fieldsCard">
        <div style="font-weight:700;margin-bottom:4px">สิทธิพิเศษ / โปรพิเศษ (ข้อความอิสระ)</div>
        <div class="hint">บอทจะพูดถึงข้อความพวกนี้ตอนลูกค้าถามสิทธิพิเศษ/ส่วนลด หรือตอนสรุปก่อนจอง — โปรไหนเลิกแล้วให้ลบข้อความทิ้งให้ว่าง บอทจะเลิกพูดถึงทันที · ช่อง "กติกา/สคริปต์" ด้านล่างคือวิธีที่ร้านอยากให้บอทพูด (ราคายึดจากเมนูเสมอ)</div>
        ${FIELD_DEFS.map(f => `
          <label class="field-label">${esc(f.label)}</label>
          <textarea class="field-input" data-field="${f.key}" rows="${f.rows || 2}">${esc(fieldToText(f, fields[f.key]))}</textarea>`).join('')}
        <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button id="fieldsSaveBtn" disabled>บันทึกข้อความ</button>
          <span class="hint" id="fieldsMsg"></span>
        </div>
      </div>`;
  const addCatHtml = `
      <div class="card" style="margin-top:28px">
        <div style="font-weight:700;margin-bottom:6px">＋ เพิ่มหมวดบริการใหม่</div>
        <div class="add-cat-row">
          <input type="text" id="newCatEmoji" class="emoji-input" placeholder="อีโมจิ">
          <input type="text" id="newCatName" placeholder="ชื่อหมวด เช่น ต่อขนตา">
          <button id="addCatBtn" type="button">เพิ่มหมวด</button>
        </div>
        <div class="hint" style="margin-top:8px">เพิ่มหมวดแล้วค่อยกด "＋ เพิ่มหมวดย่อย" (ติ๊ก "โปรฮอต" ถ้าเป็นกลุ่มโปร) และ "＋ เพิ่มรายการ" ในหมวดนั้น</div>
      </div>`;
  const helpKey = 'shopadmin_help_dismissed_' + SLUG;
  const showHelp = !localStorage.getItem(helpKey);
  const helpBannerHtml = `
      <div class="help-banner" id="helpBanner">
        <button class="close-x" id="helpClose" title="ปิด">✕</button>
        <b>วิธีใช้งาน</b>
        <ol>
          <li>เลื่อนหารายการที่ต้องการแก้ (จัดกลุ่มตามหมวด: ทำผม / ทำเล็บ / สปามือ-เท้า)</li>
          <li>แก้ชื่อรายการ ราคา หรือรายละเอียดในช่องนั้นๆ ได้เลย</li>
          <li>กด "＋ เพิ่มรายการ" ท้ายหมวดเพื่อเพิ่มบริการใหม่ · กดปุ่ม "ลบ" ข้างชื่อเพื่อเอารายการออก</li>
          <li>กดปุ่ม "บันทึกการเปลี่ยนแปลง" ด้านล่างขวา — บอทจะตอบข้อมูลใหม่ให้ลูกค้าทันที ไม่ต้องรอทีมพัฒนา</li>
          <li>กล่อง "สิทธิพิเศษ / โปรพิเศษ" ด้านบน = ข้อความโปรที่ไม่ใช่รายการเมนู (ของแถม, พาเพื่อน, สะสมแต้ม) แก้แล้วกด "บันทึกข้อความ" · โปรไหนเลิกแล้วลบให้ว่าง</li>
          <li>เปิดบริการใหม่ทั้งหมวด (เช่น ต่อขนตา) ใช้ "＋ เพิ่มหมวดบริการใหม่" ท้ายหน้า แล้ว "＋ เพิ่มหมวดย่อย" ในหมวดนั้น</li>
        </ol>
      </div>`;
  $('#app').innerHTML = `
    <div class="wrap">
      <h1>จัดการราคา</h1>
      <div class="sub">แก้ชื่อ/ราคา/รายละเอียดแล้วกด "บันทึกการเปลี่ยนแปลง" — <button id="helpReopen" class="link-btn">ดูวิธีใช้งาน</button></div>
      <a class="card" href="/shop-admin/${encodeURIComponent(SLUG)}/inbox" style="display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;color:inherit">
        <div>
          <div style="font-weight:700;margin-bottom:4px">💬 Inbox — แชทลูกค้า</div>
          <div class="hint">ดูข้อความที่ลูกค้าทักเข้ามาและคำตอบของบอท ตอบลูกค้าเองได้จากหน้านี้</div>
        </div>
        <span style="color:var(--accent);font-weight:700">เปิด →</span>
      </a>
      <div class="card bot-toggle-card">
        <div>
          <div style="font-weight:700;margin-bottom:4px">บอทตอบลูกค้าอัตโนมัติ</div>
          <div class="hint" id="botToggleStatus">${botEnabled
            ? 'เปิดอยู่ — บอทตอบลูกค้าอัตโนมัติตามปกติ'
            : 'ปิดอยู่ — บอทจะไม่ตอบเลย ต้องคอยตอบลูกค้าเองทุกข้อความ'}</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="botToggleInput" ${botEnabled ? 'checked' : ''}>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="card bot-toggle-card">
        <div>
          <div style="font-weight:700;margin-bottom:4px">แสดงรายละเอียดในลิสต์ราคา/โปรโมชั่น</div>
          <div class="hint" id="detailToggleStatus">${showDetails
            ? 'เปิดอยู่ — ลิสต์ราคา/โปรแสดงรายละเอียดใต้แต่ละรายการ'
            : 'ปิดอยู่ — ลูกค้าเห็นแค่ชื่อ+ราคา รายละเอียดใช้ตอบเฉพาะตอนลูกค้าถามเจาะจงบริการนั้น'}</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="detailToggleInput" ${showDetails ? 'checked' : ''}>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div id="helpBannerSlot">${showHelp ? helpBannerHtml : ''}</div>
      ${fieldsHtml}
      ${catsHtml}
      ${addCatHtml}
      <div class="save-bar">
        <span class="hint" id="dirtyHint"></span>
        <button id="saveBtn" disabled>บันทึกการเปลี่ยนแปลง</button>
      </div>
    </div>`;
  const bindHelpClose = () => {
    $('#helpClose').onclick = () => {
      localStorage.setItem(helpKey, '1');
      $('#helpBanner').remove();
    };
  };
  if (showHelp) bindHelpClose();
  $('#helpReopen').onclick = () => {
    if ($('#helpBanner')) return;
    $('#helpBannerSlot').innerHTML = helpBannerHtml;
    bindHelpClose();
  };
  $('#botToggleInput').onchange = async (e) => {
    const wantEnabled = e.target.checked;
    const input = e.target;
    const statusEl = $('#botToggleStatus');
    input.disabled = true;
    statusEl.textContent = 'กำลังบันทึก...';
    const r = await api('/bot-toggle', {method: 'POST', body: JSON.stringify({enabled: wantEnabled})});
    input.disabled = false;
    if (r.success) {
      statusEl.textContent = r.bot_enabled
        ? 'เปิดอยู่ — บอทตอบลูกค้าอัตโนมัติตามปกติ'
        : 'ปิดอยู่ — บอทจะไม่ตอบเลย ต้องคอยตอบลูกค้าเองทุกข้อความ';
    } else {
      input.checked = !wantEnabled;
      statusEl.textContent = 'บันทึกไม่สำเร็จ: ' + (r.error || 'ลองใหม่อีกครั้ง');
    }
  };
  $('#detailToggleInput').onchange = async (e) => {
    const wantEnabled = e.target.checked;
    const input = e.target;
    const statusEl = $('#detailToggleStatus');
    input.disabled = true;
    statusEl.textContent = 'กำลังบันทึก...';
    const r = await api('/promo-details-toggle', {method: 'POST', body: JSON.stringify({enabled: wantEnabled})});
    input.disabled = false;
    if (r.success) {
      statusEl.textContent = r.promo_show_details
        ? 'เปิดอยู่ — ลิสต์ราคา/โปรแสดงรายละเอียดใต้แต่ละรายการ'
        : 'ปิดอยู่ — ลูกค้าเห็นแค่ชื่อ+ราคา รายละเอียดใช้ตอบเฉพาะตอนลูกค้าถามเจาะจงบริการนั้น';
    } else {
      input.checked = !wantEnabled;
      statusEl.textContent = 'บันทึกไม่สำเร็จ: ' + (r.error || 'ลองใหม่อีกครั้ง');
    }
  };
  document.querySelectorAll('.item-row').forEach(row => {
    const key = row.dataset.key;
    const nInput = row.querySelector('.n-input');
    const pInput = row.querySelector('.p-input');
    const dInput = row.querySelector('.d-input');
    const onChange = () => {
      const orig = originalItems[key];
      if (nInput.value !== orig.n || pInput.value !== orig.p || dInput.value !== orig.d) {
        dirty[key] = {n: nInput.value, p: pInput.value, d: dInput.value};
      } else {
        delete dirty[key];
      }
      updateSaveBar();
    };
    nInput.addEventListener('input', onChange);
    pInput.addEventListener('input', onChange);
    dInput.addEventListener('input', onChange);
    const delBtn = row.querySelector('.del-btn');
    delBtn.onclick = () => {
      if (deleted[key] !== undefined) {           // เลิกลบ — คืนสภาพแถว
        delete deleted[key];
        row.classList.remove('deleting');
        nInput.disabled = pInput.disabled = dInput.disabled = false;
        delBtn.textContent = 'ลบ';
        onChange();                               // ค่าบนจออาจต่างจากต้นฉบับอยู่ ให้ dirty กลับมาตรงจริง
      } else {
        const orig = originalItems[key];
        if (!confirm('ลบ 「' + orig.n + '」?\nรายการจะหายจากเมนูที่บอทตอบ หลังกด "บันทึกการเปลี่ยนแปลง"')) return;
        deleted[key] = {n: orig.n, p: orig.p};    // ชื่อ+ราคาจากเซิร์ฟเวอร์ = expected_* กันลบผิดตัวตอนข้อมูลค้าง
        delete dirty[key];                        // ลบชนะแก้ — ไม่ส่ง edit ของแถวที่กำลังจะลบ
        row.classList.add('deleting');
        nInput.disabled = pInput.disabled = dInput.disabled = true;
        delBtn.textContent = 'เลิกลบ';
        updateSaveBar();
      }
    };
  });
  document.querySelectorAll('.add-item-btn').forEach(btn => {
    btn.onclick = () => addNewRow(btn.dataset.cat, Number(btn.dataset.gidx));
  });
  $('#saveBtn').onclick = doSave;
  bindFieldsCard(fields);
  document.querySelectorAll('.add-group-btn').forEach(btn => {
    btn.onclick = () => addGroup(btn.closest('.add-group-row'));
  });
  $('#addCatBtn').onclick = addCategory;
  updateSaveBar();
}

function bindFieldsCard(fields) {
  const inputs = Array.from(document.querySelectorAll('.field-input'));
  const btn = $('#fieldsSaveBtn'), msg = $('#fieldsMsg');
  const changed = () => inputs.filter(t => (t.value || '') !== fieldToText(FIELD_DEF[t.dataset.field], fields[t.dataset.field]));
  inputs.forEach(t => t.addEventListener('input', () => {
    fieldsDirty = changed().length > 0;
    btn.disabled = !fieldsDirty;
    msg.textContent = '';
  }));
  btn.onclick = async () => {
    const payload = {};
    changed().forEach(t => { payload[t.dataset.field] = textToField(FIELD_DEF[t.dataset.field], t.value); });
    if (!Object.keys(payload).length) return;
    btn.disabled = true;
    msg.textContent = 'กำลังบันทึก...';
    const r = await api('/fields', {method: 'POST', body: JSON.stringify({fields: payload})});
    if (r.success) {
      Object.assign(fields, r.fields || payload);
      inputs.forEach(t => { t.value = fieldToText(FIELD_DEF[t.dataset.field], fields[t.dataset.field]); });
      fieldsDirty = false;
      msg.textContent = 'บันทึกสำเร็จ ✓ บอทใช้ข้อความใหม่ทันที';
    } else {
      btn.disabled = false;
      msg.textContent = 'บันทึกไม่สำเร็จ: ' + (r.error || 'ลองใหม่อีกครั้ง');
    }
  };
}

// เพิ่มหมวดย่อย/หมวดใหม่ = บันทึกทันที (ไม่รอปุ่มบันทึกรวม) เพราะต้องรู้ตำแหน่งจริงจากเซิร์ฟเวอร์ก่อนถึงจะเพิ่มรายการข้างในได้
const PENDING_WARN = 'มีรายการที่แก้ค้างอยู่ยังไม่บันทึก — ทำต่อจะโหลดหน้าใหม่และทิ้งการแก้ที่ค้างอยู่ ต้องการทำต่อไหม?';

async function addGroup(row) {
  const name = row.querySelector('.grp-name-input').value.trim();
  if (!name) { alert('กรอกชื่อหมวดย่อยก่อนครับ'); return; }
  if (hasPendingChanges() && !confirm(PENDING_WARN)) return;
  const hot = row.querySelector('.grp-hot-input').checked;
  const btn = row.querySelector('.add-group-btn');
  btn.disabled = true;
  const r = await api('/promos', {method: 'POST', body: JSON.stringify({changes: [{op: 'add_group', cat_id: row.dataset.cat, name, hot}]})});
  if (r.success) {
    loadEditor(true);
  } else {
    btn.disabled = false;
    alert('เพิ่มหมวดย่อยไม่สำเร็จ: ' + (r.error || 'unknown error'));
  }
}

async function addCategory() {
  const name = $('#newCatName').value.trim(), emoji = $('#newCatEmoji').value.trim();
  if (!name) { alert('กรอกชื่อหมวดก่อนครับ'); return; }
  if (hasPendingChanges() && !confirm(PENDING_WARN)) return;
  const id = 'c' + Date.now().toString(36);   // รหัสภายใน a-z0-9 ไม่ต้องให้ผู้ใช้คิดเอง
  const btn = $('#addCatBtn');
  btn.disabled = true;
  const r = await api('/promos', {method: 'POST', body: JSON.stringify({changes: [{op: 'add_cat', id, name, emoji}]})});
  if (r.success) {
    loadEditor(true);
  } else {
    btn.disabled = false;
    alert('เพิ่มหมวดไม่สำเร็จ: ' + (r.error || 'unknown error'));
  }
}

function addNewRow(catId, gIdx) {
  const slot = document.querySelector('.add-slot[data-slot="' + catId + ':' + gIdx + '"]');
  if (!slot) return;
  const id = 'new' + (++newRowSeq);
  const div = document.createElement('div');
  div.className = 'item-row new-item';
  div.dataset.newId = id;
  div.innerHTML = `
    <div class="item-name">
      <label>ชื่อรายการ (ใหม่)</label>
      <div class="name-line">
        <input type="text" class="n-input" placeholder="เช่น ทรีทเมนต์เคราติน">
        <button class="del-btn" type="button">เอาออก</button>
      </div>
    </div>
    <div>
      <label>ราคา</label>
      <input type="text" class="p-input" placeholder="เช่น เริ่มต้น 1,590.-">
    </div>
    <div>
      <label>รายละเอียด (ไม่บังคับ)</label>
      <input type="text" class="d-input">
    </div>`;
  slot.appendChild(div);
  added[id] = {cat_id: catId, group_idx: gIdx, n: '', p: '', d: ''};
  const nInput = div.querySelector('.n-input'), pInput = div.querySelector('.p-input'), dInput = div.querySelector('.d-input');
  const sync = () => {
    added[id].n = nInput.value;
    added[id].p = pInput.value;
    added[id].d = dInput.value;
  };
  nInput.addEventListener('input', sync);
  pInput.addEventListener('input', sync);
  dInput.addEventListener('input', sync);
  div.querySelector('.del-btn').onclick = () => {
    delete added[id];
    div.remove();
    updateSaveBar();
  };
  updateSaveBar();
  nInput.focus();
}

function updateSaveBar() {
  const ne = Object.keys(dirty).length, na = Object.keys(added).length, nd = Object.keys(deleted).length;
  $('#saveBtn').disabled = (ne + na + nd) === 0;
  const parts = [];
  if (ne) parts.push(`แก้ไข ${ne}`);
  if (na) parts.push(`เพิ่ม ${na}`);
  if (nd) parts.push(`ลบ ${nd}`);
  $('#dirtyHint').textContent = parts.length ? parts.join(' · ') + ' รายการ (ยังไม่บันทึก)' : '';
}

async function doSave() {
  // กล่องข้อความสิทธิพิเศษมีของค้าง — บันทึกรายการแล้วหน้าจะโหลดใหม่ ข้อความนั้นจะหาย ต้องเตือนก่อน
  if (fieldsDirty && !confirm('มีข้อความในกล่อง "สิทธิพิเศษ / โปรพิเศษ" ที่ยังไม่ได้กด "บันทึกข้อความ" — บันทึกรายการตอนนี้จะทิ้งข้อความนั้น กด "บันทึกข้อความ" ก่อนไหม? (ยกเลิก = กลับไปกดก่อน)')) return;
  // แถวใหม่: ว่างสนิท = ตัดทิ้งเงียบๆ · กรอกครึ่งเดียว = บล็อกพร้อมบอกเหตุผล
  const addOps = [];
  for (const id of Object.keys(added)) {
    const a = added[id];
    const n = a.n.trim(), p = a.p.trim(), dv = a.d.trim();
    if (!n && !p && !dv) {
      delete added[id];
      const el = document.querySelector('[data-new-id="' + id + '"]');
      if (el) el.remove();
      continue;
    }
    if (!n || !p) {
      alert('รายการใหม่ต้องกรอก "ชื่อรายการ" และ "ราคา" ให้ครบก่อนบันทึกครับ');
      updateSaveBar();
      return;
    }
    addOps.push({op: 'add', cat_id: a.cat_id, group_idx: a.group_idx, n: n, p: p, d: dv});
  }
  // แนบ expected_n/expected_p (ค่าเดิมจากเซิร์ฟเวอร์) ทั้งตอนแก้และตอนลบ — server ใช้เช็คว่า
  // หน้าที่เรากดอยู่ยังตรงกับข้อมูลจริง ไม่แก้/ลบผิดตัวตอนมีการเปลี่ยนจากเครื่องอื่น
  const changes = Object.keys(dirty).map(key => {
    const [cat_id, group_idx, item_idx] = key.split(':');
    const orig = originalItems[key];
    return Object.assign({cat_id, group_idx: Number(group_idx), item_idx: Number(item_idx),
                          expected_n: orig.n, expected_p: orig.p}, dirty[key]);
  }).concat(Object.keys(deleted).map(key => {
    const [cat_id, group_idx, item_idx] = key.split(':');
    return {op: 'del', cat_id, group_idx: Number(group_idx), item_idx: Number(item_idx),
            expected_n: deleted[key].n, expected_p: deleted[key].p};
  })).concat(addOps);
  if (!changes.length) {
    updateSaveBar();
    return;
  }
  $('#saveBtn').disabled = true;
  $('#saveBtn').textContent = 'กำลังบันทึก...';
  const r = await api('/promos', {method: 'POST', body: JSON.stringify({changes})});
  if (r.success) {
    loadEditor(true);
  } else {
    $('#saveBtn').disabled = false;
    $('#saveBtn').textContent = 'บันทึกการเปลี่ยนแปลง';
    alert('บันทึกไม่สำเร็จ: ' + (r.error || 'unknown error'));
  }
}

async function loadEditor(justSaved) {
  const r = await api('/promos');
  if (r.success) {
    renderEditor(r.categories, r.bot_enabled, r.promo_show_details, r.fields);
    if (justSaved) {
      const hint = document.createElement('div');
      hint.className = 'msg ok';
      hint.style.marginTop = '14px';
      hint.textContent = 'บันทึกสำเร็จ ✓';
      $('.wrap').insertBefore(hint, $('.cat-title') || $('.save-bar'));
    }
  } else {
    localStorage.removeItem(pinKey);
    boot();
  }
}

async function boot() {
  const cfg = await api('/config').catch(() => ({success: false}));
  if (!cfg.success) {
    $('#app').innerHTML = '<div class="wrap"><div class="card msg err">ไม่พบร้านนี้</div></div>';
    return;
  }
  if (!cfg.configured) {
    $('#app').innerHTML = `<div class="wrap"><div class="card msg err">ร้านนี้ยังไม่ได้ตั้งค่าระบบแก้ราคาเอง ติดต่อผู้ดูแลระบบ</div></div>`;
    return;
  }
  if (localStorage.getItem(pinKey)) {
    loadEditor();
  } else {
    renderLogin(cfg.biz_name);
  }
}

boot();
</script>
